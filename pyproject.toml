[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "computing-commons"
version = "0.1.0"
description = "Reusable infrastructure for a small, high-trust technical community."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Computing Commons at Berkeley" }]
dependencies = [
    "discord.py>=2.4",
    "feedparser>=6.0",
    "httpx>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.4",
]
ui = ["streamlit>=1.32"]

[project.scripts]
tc-bot = "commons.discord.bot:main"
tc-sync-discord = "commons.discord.sync:main"

[tool.hatch.build.targets.wheel]
packages = ["src/commons"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
